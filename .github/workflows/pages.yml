name: Build & Publish (gh-pages)

# 過去問を取り込んでサイトを作り、gh-pages ブランチへ出力する。
# GitHub Pages は gh-pages ブランチから配信する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler & Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pillow

      - name: Cache IPA PDFs
        uses: actions/cache@v4
        with:
          path: .cache/pdf
          key: ipa-pdf-${{ hashFiles('scripts/sources.json') }}

      - name: Import past exams (IPA PDF -> images + catalog.json)
        run: python3 scripts/build_pastexams.py

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html app.js style.css sw.js manifest.webmanifest icon.svg data _site/
          touch _site/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
